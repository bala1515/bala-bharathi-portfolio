default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "admin") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "root") %>
  socket: /var/run/mysqld/mysqld.sock

development:
  <<: *default
  database: house_service_development

test:
  <<: *default
  database: house_service_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    database: <%= ENV.fetch("DATABASE_NAME", "house_service_production") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "house_service") %>
    password: <%= ENV["HOUSE_SERVICE_DATABASE_PASSWORD"] || ENV["DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_CACHE_NAME", "house_service_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_QUEUE_NAME", "house_service_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_CABLE_NAME", "house_service_production_cable") %>
    migrations_paths: db/cable_migrate
